name: shellcheck

# Runs on the scaffold's own shell scripts — NOT installed into consumer
# projects (unlike lint.yml.template). Only scripts meant to execute as-is
# are checked; *.template files are templates but still valid bash.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -S info install.sh install-lib.sh install-interactive.sh install-claude.sh install-verify.sh scaffold-doctor.sh uninstall.sh scripts/dev-setup.sh tests/run.sh tests/lib/common.sh tests/lib/eslint-syntax-check.sh tests/cases/*.sh githooks/pre-commit.template githooks/lib/check-size.template githooks/lib/check-large-files.template githooks/lib/check-patterns.template githooks/lib/check-filenames.template githooks/lib/check-secrets.template githooks/lib/check-hygiene.template githooks/lib/ci-changed-files.template githooks/lib/agent-precheck.template githooks/commit-msg.template
