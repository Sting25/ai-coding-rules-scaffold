name: shellcheck

# Runs on the scaffold's own shell scripts — NOT installed into consumer
# projects (unlike lint.yml.template). Only scripts meant to execute as-is
# are checked; *.template files are templates but still valid bash.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck every shipped shell file
        # The linted set used to be a literal argument list on the shellcheck
        # command. It stayed hand-maintained across 12 revisions of that list (13
        # commits to this file) and never once named
        # githooks/lib/scaffold-config.template (the rule-state resolver EVERY
        # other check consults), scaffold-audit.template or
        # check-gitleaks.template — three shipped bash libraries that therefore
        # had no static analysis at all, while eight lower-leverage siblings did.
        # A hardcoded list is what caused that gap, so the set is DISCOVERED from
        # the working tree instead: adding a shell file anywhere in the repo now
        # puts it under shellcheck with no edit here.
        #
        # Discovery is by FIRST LINE, which every shell file in this repo has in
        # one of two shapes: a `#!...sh` shebang (the executables and the
        # *.template hook artifacts), or a `# shellcheck shell=bash` directive on
        # the fragments that are SOURCED and so carry no shebang (install-lib.sh
        # and friends, tests/lib/common.sh, tests/cases/*.sh). The two python
        # templates (check-red-green, check-mutation-diff) fall out of the set
        # because `#!/usr/bin/env python3` matches neither — excluded by what
        # they are, not by a name someone must remember to keep off a list.
        #
        # `--cached --others --exclude-standard` is tracked files PLUS anything
        # new that is not gitignored. CI only ever sees tracked files, but the
        # same block pasted into a local shell then lints a script that has been
        # written and not yet committed — which is when the author still wants to
        # hear about it. Gitignored trees (node_modules, .venv) stay out.
        #
        # NOTE ON THE LOOP SHAPE: the filter is an `if`, not a
        # `head | grep -q && printf` and-or list. Under this block's own
        # `set -euo pipefail` the and-or form makes the loop exit with the status
        # of the LAST file tested, so one non-shell file at the end of the list
        # aborts the step before any guard below runs and before shellcheck is
        # ever invoked — a red job with an empty log and zero linting. An `if`
        # with no `else` exits 0 when the condition is false, so the loop's status
        # no longer depends on which filename happens to sort last.
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r -d '' f; do
            if head -n 1 -- "$f" 2>/dev/null \
              | grep -qE '^#!.*[/ ](ba|da|k|z)?sh([[:space:]]|$)|^#[[:space:]]*shellcheck[[:space:]]+shell='; then
              files+=("$f")
            fi
          done < <(git ls-files -z --cached --others --exclude-standard)

          n=${#files[@]}
          echo "shellcheck will lint $n file(s):"
          if [ "$n" -gt 0 ]; then
            printf '  %s\n' "${files[@]}"
          fi

          # GUARD 1 — EMPTY. `shellcheck` with no arguments reads stdin and exits
          # 0, so an empty set would turn this job into a green no-op: exactly the
          # silent-nothing-is-linted failure the step exists to remove, one level
          # up. Empty means discovery is broken (a dead `git ls-files`, a mangled
          # first-line regex), never "the repo has no shell files", so it is its
          # own error with its own message rather than a case of the floor below.
          if [ "$n" -eq 0 ]; then
            echo "::error::shell-file discovery returned an EMPTY list — nothing was linted. git ls-files or the first-line match in this step is broken; this is a build failure, not a clean run."
            exit 1
          fi

          # GUARD 2 — FLOOR. A smoke value, not a target: the tree holds ~55 such
          # files, so anything under 40 means the first-line match dropped a large
          # slice of the repo.
          if [ "$n" -lt 40 ]; then
            echo "::error::shell-file discovery found only $n file(s) — the first-line match in this step is broken, so shipped shell files are going unlinted."
            exit 1
          fi

          # GUARD 3 — PER-CLASS FLOORS. The whole-tree floor above cannot see the
          # failure this job was rewritten for: tests/cases/ alone is 30 of the 55
          # files, so EVERY githooks/*.template could drop out of discovery — the
          # exact class the hand-maintained list missed — and the total would still
          # clear 40. These per-prefix minimums are set a little below today's
          # counts so ordinary churn does not trip them; deleting a whole class
          # trips them, which is the point. Raise a number here only alongside the
          # deletion that lowered it.
          _sc_fail=0
          while read -r min re desc; do
            [ -n "$min" ] || continue
            got=$(printf '%s\n' "${files[@]}" | grep -cE "$re" || true)
            if [ "$got" -lt "$min" ]; then
              echo "::error::shell-file discovery found only $got $desc file(s), expected at least $min — that class dropped out of the linted set."
              _sc_fail=1
            fi
          done <<'SPECS'
          10 ^githooks/ githooks/ hook + sourced-lib template
          20 ^tests/cases/ tests/cases/ suite
          2 ^tests/(run\.sh|lib/) tests/ driver + lib
          6 ^[^/]+\.sh$ top-level installer/doctor
          SPECS
          if [ "$_sc_fail" -ne 0 ]; then
            exit 1
          fi

          shellcheck -S info -- "${files[@]}"
