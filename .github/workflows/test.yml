name: tests

# Runs the scaffold's own test harness against a throwaway git repo.
# Cross-platform matrix catches portability bugs in the hook (BSD vs GNU
# grep, file-iteration edge cases) before they hit consumer projects.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Pin the linter version (supply-chain posture: the repo's own
      # dependabot.yml justifies a cooldown so a compromised-and-yanked release
      # isn't executed minutes after publish — an unpinned `pip install ruff`
      # contradicted that). Bump deliberately.
      - run: pip install ruff==0.15.22
      - name: Install actionlint
        # Validates the rendered lint.yml is a parseable GitHub Actions workflow
        # — guards against the job-level `if: hashFiles(...)` class of error that
        # silently disables every job. Download the PINNED release asset and
        # verify its sha256 before executing it: a GitHub release asset is mutable
        # independently of its tag, so pinning only the download SCRIPT (the prior
        # approach) still trusted whatever tarball the release currently serves.
        # Pin + checksum = a swapped asset fails the build instead of running in CI.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ver=1.7.12
          # Select the asset for THIS runner's OS/arch — the matrix runs
          # ubuntu-latest (linux/amd64) and macos-latest (darwin/arm64), so a
          # hardcoded linux_amd64 binary can't execute on macOS.
          case "$(uname -s)" in Linux) os=linux ;; Darwin) os=darwin ;; *) echo "unsupported OS"; exit 1 ;; esac
          case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; *) echo "unsupported arch"; exit 1 ;; esac
          # Per-platform pinned sha256 of actionlint_1.7.12_<os>_<arch>.tar.gz — a
          # swapped release asset fails the build instead of running in CI.
          case "${os}_${arch}" in
            linux_amd64)  sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            linux_arm64)  sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            darwin_amd64) sha=5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644 ;;
            darwin_arm64) sha=aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f ;;
            *) echo "no pinned checksum for ${os}_${arch}"; exit 1 ;;
          esac
          url="https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_${os}_${arch}.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/actionlint.tgz"
          # Portable checksum verify: sha256sum on Linux, shasum -a 256 on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${sha}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          else
            echo "${sha}  $RUNNER_TEMP/actionlint.tgz" | shasum -a 256 -c -
          fi
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Static-audit our own workflows (zizmor)
        # Machine-verifies the CI hardening the scaffold claims — SHA-pinned
        # actions, persist-credentials: false, least-privilege permissions — so a
        # regression (an unpinned action, a re-introduced credential persist)
        # fails the build instead of rotting silently. Pinned version; --offline
        # keeps it hermetic (no GITHUB_TOKEN, only the static audits). zizmor only
        # accepts .yml/.yaml, so the *.yml.template files are rendered into a temp
        # dir first. Maintainer CI only — NOT installed into consumer repos.
        run: |
          pip install zizmor==1.29.0
          render="$RUNNER_TEMP/wf"
          mkdir -p "$render"
          for f in .github/workflows/*.yml.template; do
            cp "$f" "$render/$(basename "$f" .template)"
          done
          # --no-config: zizmor auto-discovers a config file named zizmor.yml
          # (docs.zizmor.sh/configuration/). Since zizmor.yml.template renders
          # into "$render" as zizmor.yml, and "$render" has no .git boundary
          # to stop the search, zizmor finds that rendered WORKFLOW and tries
          # to load it as its own CONFIG, which fails with a schema error
          # ("unknown field `name`, expected `rules`") before any audit runs.
          # Verified locally with zizmor 1.29.0: the render step above fails
          # this exact way without --no-config, and passes clean with it. The
          # repo ships no zizmor.yml config of its own, so nothing is lost.
          zizmor --offline --persona regular --no-config .github/workflows/*.yml "$render"/*.yml
      - name: Check action pins agree across real workflows and templates
        # Dependabot bumps SHA pins only in real *.yml workflows — it never parses
        # *.yml.template, so the templates silently rot one checkout-bump behind
        # (the v6.0.2/v6.0.3 drift that prompted this guard). Assert every action
        # resolves to a SINGLE SHA across both real and template files; if one
        # appears with two distinct SHAs, the templates need a manual catch-up.
        # Maintainer CI only — NOT installed into consumer repos.
        run: |
          drift="$(grep -rhoE 'uses: [A-Za-z0-9_./-]+@[0-9a-f]{40}' \
                     .github/workflows/*.yml .github/workflows/*.yml.template \
                   | sed -E 's/^uses: //' | sort -u | sed -E 's/@.*//' | sort | uniq -d)"
          if [ -n "$drift" ]; then
            echo "::error::Action pin drift — these actions have differing SHAs between"
            echo "real workflows and *.yml.template files (Dependabot only bumps the"
            echo "real *.yml; bump the templates to match):"
            # shellcheck disable=SC2001  # sed prepends a bullet to each line of multi-line $drift; ${//} has no per-line ^ anchor
            echo "$drift" | sed 's/^/  - /'
            exit 1
          fi
          echo "All action pins agree across real workflows and templates."
      - run: chmod +x tests/run.sh install.sh githooks/pre-commit.template
      - run: ./tests/run.sh
