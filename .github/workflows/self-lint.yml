name: self-lint

# The scaffold eats its own dog food: run the SAME lib/check-* guardrails the
# scaffold ships, against the scaffold's OWN tracked files. This closes the
# self-application gap — without it the repo could ship a rule (or a file) that
# violates its own guardrails with no CI signal, which is exactly how
# tests/run.sh once drifted to 1135 lines (2.27x the 500-line cap) uncaught and
# why a fix commit needed a documented --no-verify.
#
# Maintainer-only — NOT installed into consumer projects (that's
# lint.yml.template's job). It lives beside shellcheck.yml / test.yml as the
# scaffold's own server-side mirror of the pre-commit hook.
#
# The installable copies (.githooks/, .forbidden-patterns/) are gitignored here
# (see .gitignore "Accidental installs inside the scaffold repo itself"), so a
# fresh checkout has only the *.template sources. We materialize the scripts +
# pattern files from those templates first — exactly as install.sh would — then
# scan every tracked file's committed blob.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git/config

      - name: Materialize check scripts + pattern files from templates
        # Strip the .template suffix into the same paths install.sh writes, so
        # the scripts resolve their siblings (scaffold-config) and pattern files
        # (.forbidden-patterns/*.txt) the same way they do in a real install.
        run: |
          mkdir -p .githooks/lib .forbidden-patterns
          for t in githooks/lib/*.template; do
            cp "$t" ".githooks/lib/$(basename "$t" .template)"
          done
          chmod +x .githooks/lib/*
          for t in forbidden-patterns/*.txt.template; do
            cp "$t" ".forbidden-patterns/$(basename "$t" .template)"
          done

      - name: Show active rule overrides (.scaffold.toml)
        # Informational: print any per-project override so a disabled/downgraded
        # rule is visible in review, not silent. (The scaffold ships no
        # .scaffold.toml of its own, so this is normally empty.)
        run: |
          if [ -x .githooks/lib/scaffold-audit ]; then .githooks/lib/scaffold-audit; fi

      - name: Run scaffold guardrails on the scaffold's own files
        run: |
          # -z (NUL-delimited) so a filename containing a newline/tab/quote can't
          # split the list and slip a file past the scan; the check scripts read
          # each file's committed blob (git show ":0:<path>"). core.quotepath=off
          # so unicode filenames aren't C-quoted into bypass paths — same fix as
          # pre-commit.template. A shell var can't hold NUL, so the list goes via
          # a temp file fed to each check on stdin.
          STAGED_LIST=$(mktemp)
          git -c core.quotepath=off ls-files -z >"$STAGED_LIST"
          FAILED=0
          .githooks/lib/check-size      --ci <"$STAGED_LIST" || FAILED=1
          .githooks/lib/check-patterns  --ci <"$STAGED_LIST" || FAILED=1
          .githooks/lib/check-filenames --ci <"$STAGED_LIST" || FAILED=1
          .githooks/lib/check-secrets   --ci <"$STAGED_LIST" || FAILED=1
          .githooks/lib/check-hygiene   --ci <"$STAGED_LIST" || FAILED=1
          rm -f "$STAGED_LIST"
          exit $FAILED

      - name: Docs installed into consumer projects must pass the shipped prettier config
        # The other half of dogfooding: not just "our files pass our scanners"
        # but "the files we INSTALL pass the config we install beside them".
        #
        # coding-rules.md and operational-rules.md land in a consumer's project
        # root, next to a .prettierrc.json this scaffold also writes, and the
        # shipped lint.yml runs `prettier --check` over every changed file. Both
        # docs failed that config (#73) — so a consumer following the documented
        # workflow (README: "add a Project-specific section to coding-rules.md")
        # put a scaffold-authored file in the changed set and got a red format
        # check on prose they never wrote, on their first commit after install.
        #
        # Formatting them once fixes today; this step is what stops it rotting
        # back, since nothing else in this repo runs prettier. Checked under
        # their INSTALLED names in a temp dir: prettier picks its parser from the
        # extension, so AGENTS.md.template is not seen as markdown at all and
        # would silently "pass" unchecked in place.
        #
        # Scope is deliberately the installed set. README.md, CHANGELOG.md and
        # RECOMMENDATIONS.md also fail this config, but they stay in the scaffold
        # clone / npm package and never reach a consumer's tree, so no consumer
        # CI ever checks them. Reformatting them would be churn without a bug.
        run: |
          # Pinned, like the repo's other CI tool installs (ruff, zizmor,
          # actionlint): an unpinned install runs whatever published minutes ago.
          # --ignore-scripts: no lifecycle scripts from the dependency tree.
          npm install --no-audit --no-fund --ignore-scripts prettier@3.9.6
          docs="$RUNNER_TEMP/docs"
          mkdir -p "$docs"
          cp .prettierrc.json.template "$docs/.prettierrc.json"
          cp coding-rules.md operational-rules.md "$docs/"
          cp AGENTS.md.template "$docs/AGENTS.md"
          if ! npx --no-install prettier --check "$docs"/*.md; then
            echo "::error::A doc install.sh copies into consumer projects fails the"
            echo ".prettierrc.json this scaffold ships beside it. A consumer editing"
            echo "that file would get a red format check on prose they did not write."
            echo "Fix: npx prettier --write --config .prettierrc.json.template <file>"
            exit 1
          fi

      - name: Set up Node (eslint.config.js.template check)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: eslint.config.js.template lints with its documented peers (#83)
        # A third self-application gap, beside the two above: the scaffold ships
        # eslint.config.js.template, but nothing in its OWN CI ever loads it
        # through eslint, so a real rule violation in the template has no CI
        # signal. tests/cases/17 only runs `node --check`, which parses JS
        # syntax and stops there: it never resolves a plugin or validates a
        # rule's option schema. A real import-x/order violation once sat in the
        # template unnoticed until someone ran eslint on it by hand (#76).
        #
        # Peers come from the template's own header comment (its documented
        # install command), pinned like the prettier step above: eslint,
        # @eslint/js, @eslint/compat (needed for includeIgnoreFile),
        # typescript-eslint, eslint-plugin-import-x, eslint-plugin-unused-imports,
        # plus typescript itself, since strictTypeChecked needs a real
        # tsconfig.json to resolve type information. typescript is pinned below
        # its own "latest" tag on purpose: typescript-eslint 8.68.0 declares a
        # peer range of ">=4.8.4 <6.1.0", so 6.0.3 is the newest release that
        # range still allows, not the 7.x line.
        #
        # Copied to eslint.config.mjs, not eslint.config.js: the template uses
        # `import` and `import.meta.dirname`, which only parses unconditionally
        # as ESM under the .mjs extension, matching the flat-config/ESLint 9+
        # module style its own header documents.
        #
        # Running eslint against a real file is the check that matters here,
        # not `eslint --print-config`: --print-config only resolves and merges
        # config layers, it does not validate a rule's option schema (confirmed
        # locally: feeding it a corrupted max-depth option still exits 0 under
        # --print-config, but exits 2 with a schema error under a real lint
        # run). A real lint run exercises both plugin/rule loading and rule
        # validity in a single pass. The template file itself is one of the
        # files linted below (not just a throwaway sample), which is exactly
        # the self-application that caught the import-x/order bug this step
        # exists to keep from recurring silently.
        run: |
          work="$RUNNER_TEMP/eslint-template-check"
          mkdir -p "$work"
          cp eslint.config.js.template "$work/eslint.config.mjs"

          # Minimal project so strictTypeChecked's projectService can resolve
          # real type information; without a tsconfig.json the type-aware
          # rules (no-floating-promises, switch-exhaustiveness-check, ...)
          # cannot load at all.
          printf '%s\n' \
            '{' \
            '  "compilerOptions": {' \
            '    "target": "ES2022",' \
            '    "module": "ESNext",' \
            '    "moduleResolution": "Bundler",' \
            '    "strict": true' \
            '  },' \
            '  "include": ["**/*.ts", "**/*.js"]' \
            '}' > "$work/tsconfig.json"

          # A trivial, rule-clean file to lint alongside the config file itself.
          printf '%s\n' \
            'export function add(a: number, b: number): number {' \
            '  return a + b;' \
            '}' > "$work/sample.ts"

          cd "$work"
          npm install --no-audit --no-fund --ignore-scripts \
            eslint@10.9.1 @eslint/js@10.0.1 @eslint/compat@2.1.0 typescript-eslint@8.68.0 \
            eslint-plugin-import-x@4.17.1 eslint-plugin-unused-imports@4.4.1 typescript@6.0.3

          echo "eslint: linting the shipped template (as eslint.config.mjs) plus a sample file"
          npx --no-install eslint -c eslint.config.mjs sample.ts eslint.config.mjs
